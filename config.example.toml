origin = "http://localhost:3000"
# 本番の例: origin = "https://id.example.com"
name = "Kitune"
# 配色のプリセット: lavender / blue / sage / amber。未指定時は amber。
theme = "amber"

[[users]]
id = "owner"
name = "自分"
email = "owner@example.com"
email_verified = false
enabled = true
# 複数IDをここに置くと、同じユーザーになります。数値ではなく文字列です。
# Discordを使う場合だけ、環境変数DISCORD_CLIENT_ID / DISCORD_CLIENT_SECRETも設定します。
discord_ids = []
groups = ["personal"]

# 別ユーザーに分ける場合は、別の固定id・メール・Discord IDを設定します。
# [[users]]
# id = "alternate"
# name = "別アカウント"
# email = "alternate@example.com"
# discord_ids = ["333333333333333333"]
# groups = []

# secretを保持できるWebサービスごとに、別のclient IDとsecretを登録します。
# この例はHeadscale 0.29.3です。Headscale側でもS256 PKCEを有効にします。
[[clients]]
id = "headscale"
name = "Headscale"
redirect_uris = ["https://headscale.example.com/oidc/callback"]
# 省略時もclient_secret_basic。client_secret_postも選べます。
token_endpoint_auth_method = "client_secret_basic"
# 全クライアントで必須。環境変数に32文字以上のsecretを設定してください。
secret_env = "HEADSCALE_CLIENT_SECRET"
scopes = ["openid", "profile", "email"]
skip_consent = false
# require_pkceは省略時trueです。既定のS256必須を維持するため省略しています。

# Gitea 1.27.3の外部OIDCクライアントはPKCEを送らないため、このクライアントだけ例外にします。
# Giteaの認証ソース名はkitune、callbackはその名前を含む固定URLです。
# [[clients]]
# id = "gitea"
# name = "Gitea"
# redirect_uris = ["https://gitea.example.com/user/oauth2/kitune/callback"]
# secret_env = "GITEA_CLIENT_SECRET"
# scopes = ["openid", "profile", "email"]
# require_pkce = false
# skip_consent = false

# Tailscaleの互換性用初期設定です。PKCEの実挙動を確認できたらtrueへ戻します。
# [[clients]]
# id = "tailscale"
# name = "Tailscale"
# redirect_uris = ["https://login.tailscale.com/a/oauth_response"]
# secret_env = "TAILSCALE_CLIENT_SECRET"
# scopes = ["openid", "profile", "email"]
# require_pkce = false
# skip_consent = false
