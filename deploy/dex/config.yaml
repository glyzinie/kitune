issuer: https://auth.example.com
storage:
  type: sqlite3
  config:
    file: /data/dex.sqlite
web:
  http: 0.0.0.0:5556
logger:
  level: warn
  format: json
expiry:
  idTokens: 15m
  authRequests: 5m
  refreshTokens:
    validIfNotUsedFor: 720h
    absoluteLifetime: 720h
oauth2:
  responseTypes: [code]
  skipApprovalScreen: false
enablePasswordDB: false
connectors:
  - type: oidc
    id: kitune
    name: Kitune
    config:
      issuer: https://id.example.com/api/auth
      clientID: personal-dex
      clientSecret: $PERSONAL_DEX_CLIENT_SECRET
      redirectURI: https://auth.example.com/callback
      scopes: [profile, email, groups, offline_access]
      pkceChallenge: S256
      getUserInfo: true
      insecureEnableGroups: true
      claimModifications:
        modifyGroupNames:
          prefix: "kitune:"
# 実際に接続する個人サービス・家族Dex・サークルDexをここに追加します。
# 接続先が確定するまで、例示ドメインのクライアントは登録しません。
staticClients: []
