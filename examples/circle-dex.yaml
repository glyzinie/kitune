# example.netのサービスが使うサークル用Dex。storage・web・サービスのstaticClientsは別途設定します。
issuer: https://auth.example.net
connectors:
  - type: oidc
    id: owner
    name: 自分のDex
    config:
      issuer: https://auth.example.com
      clientID: circle-dex
      clientSecret: $CIRCLE_DEX_CLIENT_SECRET
      redirectURI: https://auth.example.net/callback
      scopes: [profile, email, groups, offline_access]
      pkceChallenge: S256
      getUserInfo: true
      insecureEnableGroups: true
      claimModifications:
        modifyGroupNames:
          prefix: "owner:"

# 他のメンバーも各人のDexを別の固定connector id・別のprefixで追加します。
# 個人が申告したグループを、サークルの管理者権限として無条件に扱わないでください。
