# 自分のDex。storage・web・TLS等は別途用意する設定の抜粋です。
issuer: https://auth.example.com
connectors:
  - type: oidc
    id: kitune
    name: 自分のKitune
    config:
      issuer: https://id.example.com/api/auth
      clientID: personal-dex
      clientSecret: $PERSONAL_DEX_CLIENT_SECRET
      redirectURI: https://auth.example.com/callback
      # Dexはこのscopeを自動追加しないため、更新にはoffline_accessの明示が必要。
      scopes: [profile, email, groups, offline_access]
      pkceChallenge: S256
      getUserInfo: true
      # 上流の最新UserInfoを初回・更新時に取得する構成で有効化する。
      insecureEnableGroups: true
      claimModifications:
        modifyGroupNames:
          prefix: "kitune:"

# 家族用・サークル用Dexを、この個人DexのOIDCクライアントとして登録します。
# 各接続に別の秘密値を設定し、接続先Dex側にも同じ値を渡してください。
staticClients:
  - id: family-dex
    name: 家族用Dex
    secretEnv: FAMILY_DEX_CLIENT_SECRET
    redirectURIs: [https://auth.example.jp/callback]
  - id: circle-dex
    name: サークル用Dex
    secretEnv: CIRCLE_DEX_CLIENT_SECRET
    redirectURIs: [https://auth.example.net/callback]

# 個人サービスも、このDexのstaticClientsに追加できます。
# connector idと上流subは固定します。変更すると、このDexのsubも変わります。
# メール一致で異なる認証元を自動統合する設定ではありません。
