# example.jpのサービスが使う任意の家族用共有Dex。
# storage・web・サービスのstaticClientsは別途設定します。
issuer: https://auth.example.jp
connectors:
  - type: oidc
    id: owner
    name: 自分のKitune
    config:
      issuer: https://id.example.com/api/auth
      clientID: family-dex
      clientSecret: $FAMILY_DEX_CLIENT_SECRET
      redirectURI: https://auth.example.jp/callback
      scopes: [profile, email, groups, offline_access]
      pkceChallenge: S256
      getUserInfo: true
      insecureEnableGroups: true
      claimModifications:
        modifyGroupNames:
          prefix: "owner:"

# Kituneには、クライアントIDをfamily-dex、callbackを上記URL、シークレットを同じ値にして、S256方式のPKCEが必須のクライアントとして登録します。
# 他の家族も各人のKituneまたは認証元を、別の固定connector idとシークレットで直接追加します。
# owner:personal等のグループは、この接続元の自己申告属性です。
# 家族サービスの利用許可・権限は接続元を踏まえ、サービス側のポリシーで判定します。
