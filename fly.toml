app = "kitune-example-id"
primary_region = "nrt"
kill_signal = "SIGTERM"
kill_timeout = 20

[build]
dockerfile = "Dockerfile"

[env]
NODE_ENV = "production"
PORT = "3000"
CONFIG_PATH = "/app/config.toml"
DATABASE_PATH = "/data/kitune.sqlite"

[[files]]
guest_path = "/app/config.toml"
secret_name = "IDP_CONFIG"

[[mounts]]
source = "kitune_data"
destination = "/data"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[http_service.concurrency]
type = "requests"
soft_limit = 20
hard_limit = 40

[[http_service.checks]]
method = "GET"
path = "/healthz"
interval = "30s"
timeout = "5s"
grace_period = "30s"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "512mb"
